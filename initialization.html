<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>SoraSys : Initialization</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="SoraSys : Initialization">
  <meta property="og:image" content="https://lh3.googleusercontent.com/pw/AP1GczN2n_w2oiQgGdzSgyuT3bERHavQXDHj1eyp_G_RLk3qhS6O6LQrCokdaYPi0g97mCn7U15ePaFxLQnq6bnj6krHu56jMgmSQoY1_trJoBb5S1Bj0oNB8VA1YkHBtQ3-4CwuFkp-gxHmwJAzfNVWy0Q=w1176-h1176-s-no">
  <meta name="theme-color" content="#ff3b7c">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SoraSys : Initialization">
  <meta name="twitter:image" content="https://lh3.googleusercontent.com/pw/AP1GczN2n_w2oiQgGdzSgyuT3bERHavQXDHj1eyp_G_RLk3qhS6O6LQrCokdaYPi0g97mCn7U15ePaFxLQnq6bnj6krHu56jMgmSQoY1_trJoBb5S1Bj0oNB8VA1YkHBtQ3-4CwuFkp-gxHmwJAzfNVWy0Q=w1176-h1176-s-no">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Crimson+Text:wght@400;600&family=Fira+Code:wght@300;400&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0b1114;
      color: #bcccd6;
      font-family: 'Crimson Text', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      cursor: none;
      position: relative;
      overflow-x: hidden;
    }

    /* ---------- ambient background glow ---------- */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.16;
    }
    .ambient-glow.g1 {
      width: 420px; height: 420px;
      background: #ff3b7c;
      top: -140px; left: -120px;
      animation: drift1 15s ease-in-out infinite;
    }
    .ambient-glow.g2 {
      width: 380px; height: 380px;
      background: #6b8e9b;
      bottom: -150px; right: -110px;
      animation: drift2 17s ease-in-out infinite;
    }
    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(50px, 34px); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-36px, -28px); }
    }

    #cursor {
      position: fixed;
      width: 8px;
      height: 8px;
      background: #ff3b7c;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 16px rgba(255, 59, 124, 0.25);
      display: none;
      transition: transform 0.08s ease, background 0.2s ease;
    }
    #cursor.active {
      display: block;
    }
    #cursor.hover {
      transform: translate(-50%, -50%) scale(2.8);
      background: rgba(255, 59, 124, 0.25);
      box-shadow: 0 0 32px rgba(255, 59, 124, 0.4);
    }
    @media (max-width: 640px) { 
      #cursor { display: none !important; }
      body { cursor: auto; }
    }
    .init-container {
      max-width: 440px;
      width: 100%;
      padding: 40px 32px 48px;
      background: rgba(20, 30, 35, 0.7);
      border: 1px solid rgba(107, 142, 155, 0.12);
      border-radius: 3px;
      backdrop-filter: blur(2px);
      position: relative;
      z-index: 1;
    }
    .init-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 14%;
      right: 14%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 59, 124, 0.45), transparent);
    }
    .init-title {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 28px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #6b8e9b;
      text-align: center;
      margin-bottom: 4px;
    }
    .init-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 13px;
      color: #ff3b7c;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 28px;
      opacity: 0.8;
    }
    .init-tabs {
      position: relative;
      display: flex;
      gap: 0;
      margin-bottom: 28px;
      border-bottom: 1px solid rgba(107, 142, 155, 0.12);
    }
    .init-tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #4a6673;
      cursor: pointer;
      transition: color 0.3s ease;
      border-bottom: none;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .init-tab.active {
      color: #ff3b7c;
    }
    .init-tab:hover { color: #6b8e9b; }
    .tab-indicator {
      position: absolute;
      bottom: -1px;
      height: 2px;
      background: #ff3b7c;
      box-shadow: 0 0 8px rgba(255, 59, 124, 0.6);
      transition: left 0.35s cubic-bezier(0.65, 0, 0.35, 1), width 0.35s cubic-bezier(0.65, 0, 0.35, 1);
    }
    .init-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .init-form.hidden { display: none; }
    .init-form.form-enter { animation: form-fade-in 0.35s ease; }
    @keyframes form-fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-family: 'Fira Code', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #4a6673;
    }
    .form-group label .required-mark {
      color: #ff3b7c;
    }
    .form-group input {
      background: rgba(11, 17, 20, 0.6);
      border: 1px solid rgba(107, 142, 155, 0.15);
      padding: 10px 12px;
      color: #bcccd6;
      font-family: 'Crimson Text', serif;
      font-size: 15px;
      border-radius: 2px;
      transition: border-color 0.3s ease;
      outline: none;
      width: 100%;
    }
    .form-group input:focus {
      border-color: #ff3b7c;
    }
    .form-group input::placeholder {
      color: #4a6673;
      font-style: italic;
      font-size: 13px;
    }
    .form-group textarea {
      background: rgba(11, 17, 20, 0.6);
      border: 1px solid rgba(107, 142, 155, 0.15);
      padding: 10px 12px;
      color: #bcccd6;
      font-family: 'Crimson Text', serif;
      font-size: 14px;
      line-height: 1.55;
      border-radius: 2px;
      transition: border-color 0.3s ease;
      outline: none;
      width: 100%;
      min-height: 90px;
      resize: vertical;
    }
    .form-group textarea:focus {
      border-color: #ff3b7c;
    }
    .form-group textarea::placeholder {
      color: #4a6673;
      font-style: italic;
      font-size: 13px;
    }
    .char-count {
      font-family: 'Fira Code', monospace;
      font-size: 8px;
      letter-spacing: 1px;
      color: #4a6673;
      text-align: right;
    }
    .char-count.warn { color: #ff3b7c; }
    .field-hint {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 11.5px;
      color: #4a6673;
    }

    /* ---------- avatar setup row (signup only) ---------- */
    .avatar-setup {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .avatar-setup .form-group { flex: 1; min-width: 0; }

    .author-avatar-wrap {
      width: 60px;
      height: 60px;
      position: relative;
      flex-shrink: 0;
    }
    .author-avatar-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff3b7c, #ff9bc0, #6b8e9b, #ff3b7c);
      animation: ring-rotate 9s linear infinite, ring-pulse 4.5s ease-in-out infinite;
    }
    .author-avatar,
    .author-avatar-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      z-index: 1;
    }
    .author-avatar {
      object-fit: cover;
      display: none;
      background: rgba(11, 17, 20, 0.6);
    }
    .author-avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 18px;
      color: #4a6673;
      background: rgba(11, 17, 20, 0.75);
    }
    @keyframes ring-rotate {
      to { transform: rotate(360deg); }
    }
    @keyframes ring-pulse {
      0%, 100% {
        opacity: 0.55;
        box-shadow: 0 0 12px rgba(255, 59, 124, 0.2);
      }
      50% {
        opacity: 1;
        box-shadow: 0 0 18px rgba(107, 142, 155, 0.35);
      }
    }

    .init-btn {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #0b1114;
      background: #ff3b7c;
      padding: 12px 28px;
      border: 1px solid rgba(255,59,124,0.3);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 6px;
      width: 100%;
    }
    .init-btn:hover {
      background: #ff5c8f;
      box-shadow: 0 0 28px rgba(255,59,124,0.25);
      transform: translateY(-2px);
    }
    .init-btn:active { transform: scale(0.96); }
    .init-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }
    .message {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      color: #6b8e9b;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }
    .message.error { color: #ff3b7c; }
    .message.success { color: #6b8e9b; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-family: 'Fira Code', monospace;
      font-size: 8px;
      letter-spacing: 3px;
      color: #4a6673;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .back-link:hover { color: #ff3b7c; }

    /* Already signed in state */
    .signed-in-state {
      text-align: center;
      padding: 20px 0;
    }
    .signed-in-state .greeting {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      letter-spacing: 2px;
      color: #6b8e9b;
      margin-bottom: 8px;
    }
    .signed-in-state .greeting span { color: #ff3b7c; }
    .signed-in-state .sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      color: #4a6673;
      margin-bottom: 16px;
    }
    .signed-in-state .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .signed-in-state .actions .panel-btn {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 18px;
      background: transparent;
      border: 1px solid rgba(107, 142, 155, 0.15);
      color: #4a6673;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }
    .signed-in-state .actions .panel-btn:hover {
      border-color: #ff3b7c;
      color: #ff3b7c;
    }
    .signed-in-state .actions .panel-btn.primary {
      background: #ff3b7c;
      color: #0b1114;
      border-color: #ff3b7c;
    }
    .signed-in-state .actions .panel-btn.primary:hover {
      background: #ff5c8f;
      box-shadow: 0 0 24px rgba(255,59,124,0.2);
    }
    .hidden { display: none; }

    @media (max-width: 640px) {
      .init-container { padding: 28px 20px 36px; }
      .init-title { font-size: 24px; letter-spacing: 4px; }
      body { padding: 12px; cursor: auto; }
      .signed-in-state .actions { flex-direction: column; align-items: center; }
      .ambient-glow { display: none; }
    }
  </style>
</head>
<body>
<div class="ambient-glow g1"></div>
<div class="ambient-glow g2"></div>
<div id="cursor"></div>
<div class="init-container">
  <div class="init-title">Initialization</div>
  <div class="init-sub">establish your presence</div>
  
  <!-- Already Signed In State -->
  <div id="signed-in-state" class="signed-in-state hidden">
    <div class="greeting">Welcome, <span id="signed-in-username">User</span>!</div>
    <div class="sub">You are already signed in.</div>
    <div class="actions">
      <a href="/control-panel" class="panel-btn primary">⌘ Control Panel</a>
      <a href="/profile-config" class="panel-btn">◐ Profile</a>
      <a href="/articlespace" class="panel-btn">📄 Articles</a>
      <button id="signout-from-init" class="panel-btn">↯ Sign Out</button>
    </div>
  </div>

  <!-- Sign In / Sign Up Forms -->
  <div id="auth-forms">
    <div class="init-tabs">
      <button class="init-tab active" data-tab="signin">Sign In</button>
      <button class="init-tab" data-tab="signup">Sign Up</button>
      <div class="tab-indicator" id="tab-indicator"></div>
    </div>

    <!-- Sign In Form -->
    <form id="signin-form" class="init-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="signin-username" placeholder="your username" required>
      </div>
      <div class="form-group">
        <label>Security Token</label>
        <input type="password" id="signin-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="init-btn">Access Network</button>
      <div id="signin-message" class="message"></div>
    </form>

    <!-- Sign Up Form -->
    <form id="signup-form" class="init-form hidden">
      <div class="form-group">
        <label>Choose Username</label>
        <input type="text" id="signup-username" placeholder="unique identifier" required>
      </div>
      <div class="form-group">
        <label>Security Token</label>
        <input type="password" id="signup-password" placeholder="create a strong token" required>
      </div>
      <div class="form-group">
        <label>Confirm Token</label>
        <input type="password" id="signup-confirm" placeholder="confirm your token" required>
      </div>

      <div class="avatar-setup">
        <div class="author-avatar-wrap">
          <div class="author-avatar-ring"></div>
          <img class="author-avatar" id="signup-avatar-img" alt="avatar preview">
          <div class="author-avatar-fallback" id="signup-avatar-fallback">?</div>
        </div>
        <div class="form-group">
          <label>Profile Image URL <span class="required-mark">*</span></label>
          <input type="url" id="signup-avatar-url" placeholder="https://example.com/your-image.jpg" required>
        </div>
      </div>

      <div class="form-group">
        <label>Personal Description <span class="required-mark">*</span></label>
        <textarea id="signup-bio" maxlength="1000" placeholder="Tell the network a little about yourself..." required></textarea>
        <div class="char-count" id="signup-bio-count">0 / 1000</div>
      </div>

      <button type="submit" class="init-btn">Establish Identity</button>
      <div id="signup-message" class="message"></div>
    </form>
  </div>

  <a href="/" class="back-link">↩ return to network</a>
</div>

<script>
  (function() {
    // Custom cursor
    if (window.innerWidth > 640) {
      const cursor = document.getElementById('cursor');
      if (!cursor) return;
      
      cursor.classList.add('active');
      document.body.style.cursor = 'none';
      
      let mx = -100, my = -100;
      let cx = -100, cy = -100;
      
      function updateCursor() {
        cx += (mx - cx) * 0.2;
        cy += (my - cy) * 0.2;
        cursor.style.left = cx + 'px';
        cursor.style.top = cy + 'px';
        requestAnimationFrame(updateCursor);
      }
      
      document.addEventListener('mousemove', (e) => {
        mx = e.clientX;
        my = e.clientY;
      });
      
      document.addEventListener('mouseleave', () => {
        cursor.classList.remove('active');
      });
      
      document.addEventListener('mouseenter', () => {
        cursor.classList.add('active');
      });
      
      const interactiveElements = document.querySelectorAll('button, input, textarea, a, .init-tab, .init-btn, .back-link, .panel-btn');
      interactiveElements.forEach(el => {
        el.addEventListener('mouseenter', () => {
          cursor.classList.add('hover');
        });
        el.addEventListener('mouseleave', () => {
          cursor.classList.remove('hover');
        });
      });
      
      updateCursor();
    } else {
      document.body.style.cursor = 'auto';
    }

    // DOM elements
    const signedInState = document.getElementById('signed-in-state');
    const authForms = document.getElementById('auth-forms');
    const signedInUsername = document.getElementById('signed-in-username');
    const signoutBtn = document.getElementById('signout-from-init');

    const tabs = document.querySelectorAll('.init-tab');
    const tabIndicator = document.getElementById('tab-indicator');
    const signinForm = document.getElementById('signin-form');
    const signupForm = document.getElementById('signup-form');

    // ============================================
    // Sliding tab indicator
    // ============================================
    function moveIndicatorTo(tab) {
      tabIndicator.style.left = tab.offsetLeft + 'px';
      tabIndicator.style.width = tab.offsetWidth + 'px';
    }
    // Position on load (and again after fonts/layout settle)
    requestAnimationFrame(() => moveIndicatorTo(document.querySelector('.init-tab.active')));
    window.addEventListener('resize', () => {
      moveIndicatorTo(document.querySelector('.init-tab.active'));
    });

    // ============================================
    // Check if user is already signed in
    // ============================================
    async function checkAuthStatus() {
      try {
        const res = await fetch('/api/auth/status');
        const data = await res.json();
        
        if (data.authenticated && data.user) {
          // User is signed in - show welcome state
          signedInUsername.textContent = data.user.username;
          signedInState.classList.remove('hidden');
          authForms.classList.add('hidden');
          document.querySelector('.init-sub').textContent = 'you are already connected';
        } else {
          // User is not signed in - show forms
          signedInState.classList.add('hidden');
          authForms.classList.remove('hidden');
          document.querySelector('.init-sub').textContent = 'establish your presence';
        }
      } catch (err) {
        console.error('Auth check error:', err);
        // Show forms on error
        signedInState.classList.add('hidden');
        authForms.classList.remove('hidden');
      }
    }

    // ============================================
    // Sign out from initialization page
    // ============================================
    signoutBtn.addEventListener('click', async () => {
      try {
        await fetch('/api/auth/signout', { method: 'POST' });
        // Refresh the page to show sign in forms
        window.location.reload();
      } catch (err) {
        console.error('Signout error:', err);
        window.location.reload();
      }
    });

    // ============================================
    // Tab switching
    // ============================================
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        moveIndicatorTo(tab);

        const showForm = tab.dataset.tab === 'signin' ? signinForm : signupForm;
        const hideForm = tab.dataset.tab === 'signin' ? signupForm : signinForm;

        hideForm.classList.add('hidden');
        showForm.classList.remove('hidden');
        showForm.classList.remove('form-enter');
        void showForm.offsetWidth; // restart animation
        showForm.classList.add('form-enter');

        document.querySelectorAll('.message').forEach(m => {
          m.textContent = '';
          m.className = 'message';
        });
      });
    });

    // ============================================
    // Signup avatar live preview
    // ============================================
    const signupAvatarUrl = document.getElementById('signup-avatar-url');
    const signupAvatarImg = document.getElementById('signup-avatar-img');
    const signupAvatarFallback = document.getElementById('signup-avatar-fallback');

    signupAvatarUrl.addEventListener('input', () => {
      const url = signupAvatarUrl.value.trim();
      if (!url) {
        signupAvatarImg.style.display = 'none';
        signupAvatarFallback.style.display = 'flex';
        return;
      }
      signupAvatarImg.onload = () => {
        signupAvatarImg.style.display = 'block';
        signupAvatarFallback.style.display = 'none';
      };
      signupAvatarImg.onerror = () => {
        signupAvatarImg.style.display = 'none';
        signupAvatarFallback.style.display = 'flex';
      };
      signupAvatarImg.src = url;
    });

    // ============================================
    // Signup bio character count
    // ============================================
    const signupBio = document.getElementById('signup-bio');
    const signupBioCount = document.getElementById('signup-bio-count');
    signupBio.addEventListener('input', () => {
      const len = signupBio.value.length;
      signupBioCount.textContent = len + ' / 1000';
      signupBioCount.classList.toggle('warn', len > 900);
    });

    // ============================================
    // Sign Up
    // ============================================
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signup-username').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      const avatar_url = signupAvatarUrl.value.trim();
      const bio = signupBio.value.trim();
      const msg = document.getElementById('signup-message');
      const btn = e.target.querySelector('.init-btn');
      
      msg.textContent = '';
      msg.className = 'message';
      
      if (!username || !password || !confirm) {
        msg.textContent = 'All fields are required.';
        msg.className = 'message error';
        return;
      }
      if (username.length < 3) {
        msg.textContent = 'Username must be at least 3 characters.';
        msg.className = 'message error';
        return;
      }
      if (password.length < 8) {
        msg.textContent = 'Security token must be at least 8 characters.';
        msg.className = 'message error';
        return;
      }
      if (password !== confirm) {
        msg.textContent = 'Tokens do not match.';
        msg.className = 'message error';
        return;
      }
      if (!avatar_url) {
        msg.textContent = 'A profile image URL is required.';
        msg.className = 'message error';
        return;
      }
      if (!/^https?:\/\/.+/i.test(avatar_url)) {
        msg.textContent = 'Image URL must start with http:// or https://';
        msg.className = 'message error';
        return;
      }
      if (!bio) {
        msg.textContent = 'A personal description is required.';
        msg.className = 'message error';
        return;
      }
      if (bio.length < 10) {
        msg.textContent = 'Description should be at least 10 characters.';
        msg.className = 'message error';
        return;
      }
      
      btn.disabled = true;
      msg.textContent = 'Creating account...';
      msg.className = 'message';
      
      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });
        
        let data;
        try {
          data = await res.json();
        } catch (parseError) {
          console.error('Response is not JSON:', parseError);
          throw new Error('Server returned invalid response format');
        }
        
        if (!res.ok) {
          msg.textContent = data.error || data.message || 'Signup failed.';
          msg.className = 'message error';
          btn.disabled = false;
          return;
        }

        // Account created and session cookie is now set — immediately
        // attach the required profile picture and description.
        let profileWarning = '';
        try {
          const profRes = await fetch('/api/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ avatar_url, bio })
          });
          if (!profRes.ok) {
            profileWarning = ' (profile details could not be saved — add them from the Profile page)';
          }
        } catch (profileErr) {
          console.error('Profile save error:', profileErr);
          profileWarning = ' (profile details could not be saved — add them from the Profile page)';
        }
        
        msg.textContent = 'Identity established!' + profileWarning;
        msg.className = 'message success';
        btn.disabled = false;
        
        // Clear form
        document.getElementById('signup-username').value = '';
        document.getElementById('signup-password').value = '';
        document.getElementById('signup-confirm').value = '';
        signupAvatarUrl.value = '';
        signupBio.value = '';
        signupAvatarImg.style.display = 'none';
        signupAvatarFallback.style.display = 'flex';
        signupBioCount.textContent = '0 / 1000';
        signupBioCount.classList.remove('warn');
        
        // Check auth status to show signed-in state
        setTimeout(() => {
          checkAuthStatus();
          // Switch to sign in tab
          tabs.forEach(t => t.classList.remove('active'));
          const signinTab = document.querySelector('[data-tab="signin"]');
          signinTab.classList.add('active');
          moveIndicatorTo(signinTab);
          signinForm.classList.remove('hidden');
          signupForm.classList.add('hidden');
        }, 1000);
        
      } catch (err) {
        console.error('Signup error:', err);
        msg.textContent = 'Network error: ' + err.message;
        msg.className = 'message error';
        btn.disabled = false;
      }
    });

    // ============================================
    // Sign In
    // ============================================
    document.getElementById('signin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signin-username').value.trim();
      const password = document.getElementById('signin-password').value;
      const msg = document.getElementById('signin-message');
      const btn = e.target.querySelector('.init-btn');
      
      msg.textContent = '';
      msg.className = 'message';
      
      if (!username || !password) {
        msg.textContent = 'All fields are required.';
        msg.className = 'message error';
        return;
      }
      
      btn.disabled = true;
      msg.textContent = 'Authenticating...';
      msg.className = 'message';
      
      try {
        const res = await fetch('/api/auth/signin', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });
        
        let data;
        try {
          data = await res.json();
        } catch (parseError) {
          console.error('Response is not JSON:', parseError);
          throw new Error('Server returned invalid response format');
        }
        
        if (!res.ok) {
          msg.textContent = data.error || data.message || 'Authentication failed.';
          msg.className = 'message error';
          btn.disabled = false;
          return;
        }
        
        msg.textContent = 'Access granted!';
        msg.className = 'message success';
        btn.disabled = false;
        
        // Clear form
        document.getElementById('signin-username').value = '';
        document.getElementById('signin-password').value = '';
        
        // Check auth status to show signed-in state
        setTimeout(() => {
          checkAuthStatus();
        }, 500);
        
      } catch (err) {
        console.error('Signin error:', err);
        msg.textContent = 'Network error: ' + err.message;
        msg.className = 'message error';
        btn.disabled = false;
      }
    });

    // ============================================
    // Initialize - Check auth status on load
    // ============================================
    checkAuthStatus();
  })();
</script>
</body>
</html>
