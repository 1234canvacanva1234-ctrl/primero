<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Article...</title>
  
  <!-- 
    CRITICAL: Ensure ALL your CSS, JS, and asset paths 
    start with a leading slash '/' so they load from root!
    Example: <link rel="stylesheet" href="/global.css">
  -->
</head>
<body>

  <!-- Your Article Container (Adjust IDs to match your layout) -->
  <div id="article-wrapper">
    <h1 id="article-title">Loading...</h1>
    <div id="article-meta"></div>
    <hr>
    <div id="article-content">Please wait while we fetch the article...</div>
  </div>

  <script>
    async function loadArticle() {
      try {
        // 1. Isolate the slug from the clean browser URL path
        const currentPath = window.location.pathname; 
        const slug = currentPath.split('/').filter(Boolean).pop(); 
        
        if (!slug || slug === 'articlespace') {
          throw new Error("Invalid article path");
        }

        console.log("Static placeholder caught slug:", slug);

        // 2. Fetch the data from your existing working API route
        // (If your endpoint handles slugs differently, adjust this URL path)
        const response = await fetch(`/api/articles`);
        if (!response.ok) throw new Error("Failed to reach API server");

        const articles = await response.json();
        
        // 3. Find the specific article matching your slug path
        // (If your DB schema uses a different field name, swap 'title' out)
        const article = articles.find(a => {
          const matchTarget = a.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
          return matchTarget === slug || String(a.id) === slug;
        });

        if (!article) {
          document.getElementById('article-content').innerHTML = "<h1>404: Article Not Found</h1>";
          document.getElementById('article-title').innerText = "Not Found";
          return;
        }

        // 4. Paint the database data onto the screen
        document.title = article.title;
        document.getElementById('article-title').innerText = article.title;
        document.getElementById('article-content').innerHTML = article.content;
        
        if (article.author) {
          document.getElementById('article-meta').innerText = `By ${article.author} on ${new Date(article.created_at).toLocaleDateString()}`;
        }

      } catch (err) {
        console.error("Routing error:", err);
        document.getElementById('article-content').innerHTML = `<h1>Error Loading Article</h1><p>${err.message}</p>`;
      }
    }

    // Fire the engine immediately on page load
    loadArticle();
  </script>
</body>
</html>
